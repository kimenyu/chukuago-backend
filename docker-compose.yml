services:
  redis:
    image: redis:7-alpine
    container_name: chukuago_redis
    command: redis-server --requirepass secret --loglevel warning
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "secret", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: chukuago_api
    depends_on:
      redis:
        condition: service_healthy
    env_file: .env
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  redisdata: