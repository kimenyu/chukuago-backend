version: "3.8"

services:
  db:
    image: postgres:15
    container_name: chukuago_postgres
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: chukuago
      POSTGRES_USER: chukuago_user
      POSTGRES_PASSWORD: strongpassword
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./cmd/migrate/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chukuago_user -d chukuago"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  redis:
    image: redis:7
    container_name: chukuago_redis
    restart: always
    ports:
      - "6380:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  app:
    build: .
    container_name: chukuago_app
    restart: always
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://chukuago_user:strongpassword@db:5432/chukuago?sslmode=disable
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ""
      REDIS_DB: 0
      JWT_SECRET: supersecretkey
      JWT_EXPIRATION_SECONDS: 86400
      RATE_LIMIT_REQUESTS_PER_MIN: 300
      RATE_LIMIT_BURST: 20
      API_ADDR: ":8080"
      APP_NAME: chukuago-api
      APP_ENV: development
      LOG_LEVEL: info
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data: